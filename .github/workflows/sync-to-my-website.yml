name: Sync to my-website Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout website-2 repository
        uses: actions/checkout@v4
        with:
          repository: lorne-therapy/website-2
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Checkout my-website repository
        uses: actions/checkout@v4
        with:
          repository: lorne-therapy/my-website
          token: ${{ secrets.SYNC_TOKEN }}
          path: my-website-target

      - name: Sync all files from website-2 to my-website
        run: |
          # Remove all files from my-website except .git directory
          cd my-website-target
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +
          
          # Copy all files from website-2 to my-website
          cp -r ../* . 2>/dev/null || true
          
          # Clean up the nested my-website-target directory if it exists
          rm -rf my-website-target

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit and push changes
        working-directory: my-website-target
        run: |
          git add -A
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync: Update from website-2 repository"
            git push origin main
            echo "Successfully pushed changes to my-website"
          fi
